    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .property-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .property-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.12); }
        .loader { border: 4px solid #f3f4f6; border-top: 4px solid #2563eb; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .custom-select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1rem;
            padding-right: 3.2rem !important;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Tuỳ chỉnh thanh cuộn đẹp hơn cho Modal */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }

        /* ==========================================================
           MOTION SYSTEM — chuyển động nhẹ, mượt, không giật layout
           ========================================================== */
        :root {
            --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
            --motion-fast: 180ms;
            --motion-normal: 300ms;
            --motion-slow: 500ms;
        }

        html { scroll-behavior: smooth; }

        .property-card {
            transition:
                transform var(--motion-normal) var(--ease-smooth),
                box-shadow var(--motion-normal) var(--ease-smooth),
                border-color var(--motion-normal) var(--ease-standard),
                opacity var(--motion-normal) var(--ease-standard);
            will-change: transform;
        }

        .property-card:hover {
            transform: translate3d(0, -5px, 0);
            box-shadow: 0 16px 34px -8px rgba(0, 0, 0, 0.14);
        }

        .property-card .property-image {
            transition: transform 650ms var(--ease-smooth), filter 350ms var(--ease-standard);
            will-change: transform;
        }

        .property-card:hover .property-image {
            transform: scale(1.045);
        }

        .property-card .card-content {
            transition: background-color var(--motion-normal) var(--ease-standard);
        }

        .filter-control,
        .tab-btn,
        .modal-action,
        .lightbox-control {
            transition:
                transform var(--motion-fast) var(--ease-smooth),
                background-color var(--motion-fast) var(--ease-standard),
                border-color var(--motion-fast) var(--ease-standard),
                box-shadow var(--motion-fast) var(--ease-standard),
                color var(--motion-fast) var(--ease-standard),
                opacity var(--motion-fast) var(--ease-standard);
        }

        .filter-control:active,
        .tab-btn:active,
        .modal-action:active,
        .lightbox-control:active {
            transform: scale(0.98);
        }

        /* ==========================================================
           MODAL / LIGHTBOX MOTION — layered, mềm và tự nhiên
           ========================================================== */

        #modalOverlay,
        #lightboxOverlay {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition:
                opacity 340ms cubic-bezier(0.22, 1, 0.36, 1),
                visibility 340ms step-end;
        }

        #modalOverlay.is-open,
        #lightboxOverlay.is-open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transition:
                opacity 340ms cubic-bezier(0.22, 1, 0.36, 1),
                visibility 0s;
        }

        /* Modal: backdrop hiện trước, panel theo sau một nhịp rất nhỏ */
        #modalOverlay > .modal-panel {
            opacity: 0;
            transform: translate3d(0, 28px, 0) scale(0.965);
            filter: blur(3px);
            transform-origin: center center;
            transition:
                opacity 260ms cubic-bezier(0.4, 0, 0.2, 1),
                transform 480ms cubic-bezier(0.16, 1, 0.3, 1),
                filter 320ms cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, opacity, filter;
        }

        #modalOverlay.is-open > .modal-panel {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
            filter: blur(0);
            transition-delay: 35ms;
        }

        /* Khi đóng: nhanh hơn mở, tạo cảm giác UI phản hồi tức thì */
        #modalOverlay:not(.is-open) > .modal-panel {
            transition-duration:
                190ms,
                250ms,
                160ms;
        }

        /* Lightbox: ảnh đi vào nhẹ từ nhỏ đến đúng kích thước */
        #lightboxImg {
            opacity: 0;
            transform: scale(0.94) translate3d(0, 8px, 0);
            filter: blur(2px);
            transition:
                opacity 260ms cubic-bezier(0.4, 0, 0.2, 1),
                transform 430ms cubic-bezier(0.16, 1, 0.3, 1),
                filter 280ms cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, opacity, filter;
        }

        #lightboxOverlay.is-open #lightboxImg {
            opacity: 1;
            transform: scale(1) translate3d(0, 0, 0);
            filter: blur(0);
            transition-delay: 45ms;
        }

        /* Nút đóng / điều hướng có phản hồi nhanh */
        #modalOverlay button,
        #lightboxOverlay button {
            transition:
                transform 180ms cubic-bezier(0.22, 1, 0.36, 1),
                background-color 180ms ease,
                opacity 180ms ease;
        }

        #modalOverlay button:hover,
        #lightboxOverlay button:hover {
            transform: scale(1.045);
        }

        #modalOverlay button:active,
        #lightboxOverlay button:active {
            transform: scale(0.94);
        }

        @media (prefers-reduced-motion: reduce) {
            #modalOverlay,
            #lightboxOverlay,
            #modalOverlay > .modal-panel,
            #lightboxImg {
                transition: none !important;
                transform: none !important;
                filter: none !important;
            }
        }

        #toast {
            transition:
                transform 360ms var(--ease-smooth),
                opacity 260ms var(--ease-standard);
            will-change: transform, opacity;
        }

        .grid-enter {
            animation: gridEnter 420ms var(--ease-smooth) both;
        }

        @keyframes gridEnter {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *,
            *::before,
            *::after {
                animation-duration: 1ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 1ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* ==========================================================
           BRAND LOGO
           ========================================================== */
        .logo-007-wrap {
            display: inline-flex;
            align-items: center;
            flex: 0 0 auto;
            line-height: 0;
        }

        .logo-007 {
            display: block;

            height: auto;
            overflow: visible;

        .logo-007 .logo-white {
            fill: #ffffff;
            stroke: #cbd5e1;
            stroke-width: 1.35px;
            stroke-linejoin: round;

        .logo-007 .logo-blue {
            fill: #2563eb;
            stroke: #1d4ed8;
            stroke-width: 0.8px;
            stroke-linejoin: round;
            paint-order: stroke fill;
        }

        /* ==========================================================
           MODAL SCROLL
           Scrollbar stays inside the rounded frame.
           Close button stays outside the scroll layer.
           ========================================================== */
        .modal-panel {
            position: relative;
            max-height: calc(100vh - 32px);
            overflow: visible;
            box-sizing: border-box;
        }

        .modal-scroll-frame {
            width: 100%;
            max-height: calc(100vh - 32px);
            overflow: hidden;
            border-radius: 1.5rem;
            box-sizing: border-box;
        }

        .modal-scroll-area {
            min-height: 0;
            max-height: calc(100vh - 32px);
            overflow: auto;
            scrollbar-gutter: stable;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        .modal-scroll-area::-webkit-scrollbar { width: 5px; }
        .modal-scroll-area::-webkit-scrollbar-track { background: transparent; }
        .modal-scroll-area::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 999px;
        }
        .modal-scroll-area::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .modal-close-btn {
            position: absolute;
            top: -12px;
            right: -12px;

            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.18);
        }

        @media (max-width: 640px) {
            .modal-panel,
            .modal-scroll-frame,
            .modal-scroll-area {
                max-height: calc(100vh - 24px);
            }

            .logo-007 { width: 96px; }

            .modal-close-btn {
                top: -8px;
                right: -8px;
                width: 38px;
                height: 38px;
            }
        }

    </style>
</head>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        /* ==========================================================
           007 PROPERTY SYSTEM — CLEAN / SMOOTH / OPTIMIZED
           ========================================================== */

        const CSV_URL = '/api/data';
        const FALLBACK_IMAGE = 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=800&q=80';

        const state = {
            properties: [],
            activeTab: 'Tất cả',
            currentProperty: null,
            currentImageIndex: 0,
            searchTimer: null,
            toastTimer: null
        };

        const $ = (selector, root = document) => root.querySelector(selector);
        const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

        const els = {
            grid: $('#grid'),
            loading: $('#loading'),
            error: $('#error'),
            contentGrid: $('#contentGrid'),
            resultCount: $('#resultCount'),
            search: $('#headerSearchInput'),
            type: $('#filterType'),
            status: $('#filterStatus'),
            sort: $('#filterSort'),
            modal: $('#modalOverlay'),
            lightbox: $('#lightboxOverlay'),
            lightboxImg: $('#lightboxImg'),
            lightboxCaption: $('#lightboxCaption'),
            toast: $('#toast'),
            toastMsg: $('#toastMsg')
        };

        const formatPrice = (price) => {
            const num = Number(price);
            if (!Number.isFinite(num) || num === 0) return 'Thỏa thuận';
            return new Intl.NumberFormat('vi-VN', {
                style: 'currency',
                currency: 'VND'
            }).format(num);
        };

        const escapeHtml = (value = '') =>
            String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        const parseImages = (value) => {
            if (!value) return [FALLBACK_IMAGE];

            const urls = String(value)
                .split(/[\n,|]+/)
                .map(url => url.trim())
                .filter(url => /^https?:\/\/.{5,}/i.test(url));

            return urls.length ? urls : [FALLBACK_IMAGE];

        function getFilteredProperties() {
            const search = els.search.value.toLowerCase().trim();
            const type = els.type.value;
            const status = els.status.value;
            const sort = els.sort.value;

            const result = state.properties.filter(property => {
                const searchable = [
                    property.title,
                    property.location,
                    property.address,
                    property.propertyType
                ].join(' ').toLowerCase();

                const matchTab =
                    state.activeTab === 'Tất cả' ||
                    property.transactionType === state.activeTab;

                const matchSearch = !search || searchable.includes(search);

                const matchType =
                    type === 'Tất cả' ||
                    property.propertyType === type;

                const matchStatus =
                    status === 'Tất cả' ||
                    (status === 'Đang trống' && property.isAvailable) ||
                    (status === 'Đã giao dịch' && !property.isAvailable);

                return matchTab && matchSearch && matchType && matchStatus;
            });

            switch (sort) {
                case 'price-asc':
                    result.sort((a, b) => a.rawPrice - b.rawPrice);
                    break;
                case 'price-desc':
                    result.sort((a, b) => b.rawPrice - a.rawPrice);
                    break;
                case 'area-desc':
                    result.sort((a, b) => b.area - a.area);
                    break;
            }

            return result;
        }

        window.openModal = function(id) {
            const property = state.properties.find(item => item.id === String(id));
            if (!property) return;

            state.currentProperty = property;
            state.currentImageIndex = 0;

            renderModalContent();
            document.body.style.overflow = 'hidden';

            /* Ép browser paint trạng thái đóng trước khi chạy animation */
            els.modal.classList.remove('is-open');
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    if (state.currentProperty === property) {
                        els.modal.classList.add('is-open');
                    }
                });
            });

            if (history.replaceState) {
                history.replaceState(null, '', `#id=${encodeURIComponent(property.id)}`);
            } else {
                window.location.hash = `id=${encodeURIComponent(property.id)}`;
            }
        };

        window.closeModal = function() {
            if (!els.modal.classList.contains('is-open')) return;

            els.modal.classList.remove('is-open');
            document.body.style.overflow = '';

            /* Chờ animation đóng hoàn tất rồi mới xoá DOM */
            setTimeout(() => {
                if (!els.modal.classList.contains('is-open')) {
                    els.modal.innerHTML = '';
                    state.currentProperty = null;
                }
            }, 360);

            if (window.location.hash.includes('id=')) {
                history.replaceState(null, '', window.location.pathname + window.location.search);
            }
        };

        window.changeModalImage = function(direction) {
            if (!state.currentProperty) return;

            const total = state.currentProperty.images.length;
            state.currentImageIndex = (state.currentImageIndex + direction + total) % total;
            updateModalImageView();
        };

        window.selectModalImage = function(index) {
            if (!state.currentProperty) return;

            state.currentImageIndex = index;
            updateModalImageView();
        };

        function updateModalImageView() {
            const property = state.currentProperty;
            const mainImg = $('#modalMainImg');
            const counter = $('#imgCounter');

            if (!property || !mainImg) return;

            mainImg.style.opacity = '0.45';
            mainImg.style.transform = 'scale(0.985)';

            const nextSrc = property.images[state.currentImageIndex];

            const preloader = new Image();
            preloader.onload = () => {
                if (!mainImg || !state.currentProperty) return;

                mainImg.src = nextSrc;
                requestAnimationFrame(() => {
                    mainImg.style.opacity = '1';
                    mainImg.style.transform = 'scale(1)';
                });
            };
            preloader.onerror = () => {
                mainImg.src = FALLBACK_IMAGE;
                mainImg.style.opacity = '1';
                mainImg.style.transform = 'scale(1)';
            };
            preloader.src = nextSrc;

            if (counter) counter.textContent = state.currentImageIndex + 1;

            $$('#thumbnailContainer img').forEach((img, index) => {
                img.classList.toggle('border-blue-600', index === state.currentImageIndex);
                img.classList.toggle('scale-95', index === state.currentImageIndex);
                img.classList.toggle('opacity-100', index === state.currentImageIndex);
                img.classList.toggle('shadow-md', index === state.currentImageIndex);
                img.classList.toggle('border-transparent', index !== state.currentImageIndex);
                img.classList.toggle('opacity-60', index !== state.currentImageIndex);
            });
        }

        window.openLightbox = function(index) {
            if (!state.currentProperty) return;

            const property = state.currentProperty;
            const safeIndex = Math.max(0, Math.min(index, property.images.length - 1));

            els.lightboxImg.classList.remove('is-open');
            els.lightboxImg.src = property.images[safeIndex];
            els.lightboxCaption.textContent =
                `${property.title} (${safeIndex + 1}/${property.images.length})`;

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    if (state.currentProperty === property) {
                        els.lightbox.classList.add('is-open');

            const id = decodeURIComponent(match[1]);

        function handleGridKeyboard(event) {
            if (event.key !== 'Enter' && event.key !== ' ') return;

            const card = event.target.closest('[data-property-id]');
            if (!card) return;

            event.preventDefault();
            openModal(card.dataset.propertyId);

            els.loading.classList.remove('hidden');
            els.error.classList.add('hidden');
            els.contentGrid.classList.add('hidden');

            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                transformHeader: header => header.trim().toLowerCase(),

                complete(results) {
                    try {
                        state.properties = results.data
                            .filter(item => item.id && item.title)
                            .map(normalizeProperty);

                        if (!state.properties.length) {
                            showError('Không có dữ liệu bất động sản hợp lệ.');
                            return;
                        }

                        els.loading.classList.add('hidden');
                        els.contentGrid.classList.remove('hidden');

                        render();
                        checkUrlHash();
                    } catch (error) {
                        console.error('[007] Data normalization error:', error);
                        showError('Cấu trúc cột trong Google Sheet không khớp. Vui lòng kiểm tra lại.');
                    }
                },

                error(error) {
                    console.error('[007] CSV loading error:', error);
                    showError('Không thể tải dữ liệu. Vui lòng kiểm tra lại nguồn dữ liệu.');
                }
            });
        }

        /* ==========================================================
           EVENTS — dùng delegation, tránh tạo hàng trăm listener
           ========================================================== */

        els.search.addEventListener('input', triggerSearchAndScroll);
        els.type.addEventListener('change', render);
        els.status.addEventListener('change', render);
        els.sort.addEventListener('change', render);

        $('#tabs-container').addEventListener('click', event => {
            const button = event.target.closest('.tab-btn');
            if (button) setActiveTab(button.dataset.tab);
        });

        $$('[data-scroll-target]').forEach(link => {
            link.addEventListener('click', event => {
                event.preventDefault();
                scrollToSection($('#' + link.dataset.scrollTarget));
            });
        });

        els.grid.addEventListener('click', handleGridInteraction);
        els.grid.addEventListener('keydown', handleGridKeyboard);

        els.modal.addEventListener('click', event => {
            if (event.target === els.modal) closeModal();
        });

        els.lightbox.addEventListener('click', event => {
            if (event.target === els.lightbox) closeLightbox();
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                if (els.lightbox.classList.contains('is-open')) {
                    closeLightbox();
                } else if (els.modal.classList.contains('is-open')) {
                    closeModal();
                }
            }

            if (
                state.currentProperty &&
                els.modal.classList.contains('is-open') &&
                state.currentProperty.images.length > 1
            ) {
                if (event.key === 'ArrowLeft') changeModalImage(-1);
                if (event.key === 'ArrowRight') changeModalImage(1);
            }
        });

        window.addEventListener('hashchange', checkUrlHash);

        loadProperties();

        /* ==========================================================
           HỆ THỐNG BẢO MẬT CƠ BẢN
           Lưu ý: client-side protection không thể chống sao chép tuyệt đối.
           ========================================================== */

        document.addEventListener('contextmenu', event => {
            event.preventDefault();
        });

        document.addEventListener('keydown', event => {
            const blocked =
                event.key === 'F12' ||
                (event.ctrlKey && event.shiftKey && ['I', 'J', 'C'].includes(event.key.toUpperCase())) ||
                (event.ctrlKey && ['U', 'S'].includes(event.key.toUpperCase())) ||
                (event.ctrlKey && event.shiftKey && event.key.toUpperCase() === 'U');

            if (blocked) {
                event.preventDefault();
            }
        });

    </script>
</body>
</html>
